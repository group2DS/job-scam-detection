# Render Blueprint for the Hakiki Hire API.
#
# Creates the FastAPI web service and a Render Postgres database, then wires
# the database connection string into the API automatically.
#
# PostgreSQL is used instead of SQLite because reviewer accounts, case records,
# decisions, and audit history must persist across service restarts and deploys.

services:
  - type: web
    name: job-scam-api
    runtime: python
    plan: free
    region: frankfurt
    branch: feature/dashboard

    buildCommand: pip install -r requirements.txt
    startCommand: >-
      uvicorn src.api.main:app
      --host 0.0.0.0
      --port $PORT

    healthCheckPath: /api/health

    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"

      - key: DATABASE_URL
        fromDatabase:
          name: job-scam-db
          property: connectionString

      # Render generates a secure JWT signing secret for the API.
      - key: JWT_SECRET_KEY
        generateValue: true

      - key: JWT_ALGORITHM
        value: HS256

      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"

      # Used by scripts/seed_admin.py --non-interactive.
      # Render requests these values securely during Blueprint creation.
      - key: ADMIN_USERNAME
        sync: false

      - key: ADMIN_DISPLAY_NAME
        sync: false

      - key: ADMIN_PASSWORD
        sync: false

      # Keep the job-seeker UI and local development origins here.
      # After deploying the Hakiki Hire Streamlit dashboard, append its exact
      # streamlit.app origin to this comma-separated value.
      - key: CORS_ORIGINS
        value: >-
          https://hakikihire.vercel.app,https://job-scam-detection-five.vercel.app,http://localhost:5173

databases:
  - name: job-scam-db
    plan: free
    region: frankfurt
